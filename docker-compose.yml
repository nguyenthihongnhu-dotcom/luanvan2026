services:
  mysql:
    image: mysql:8.4
    container_name: bambi-wms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warehouse_management
      MYSQL_USER: bambi
      MYSQL_PASSWORD: bambi
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Một file duy nhất: lược đồ + dữ liệu khởi tạo + dữ liệu mẫu.
      - ./backend/warehouse_management_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bambi-wms-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: mysql://bambi:bambi@mysql:3306/warehouse_management
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
    ports:
      - "3000:3000"

volumes:
  mysql-data:
